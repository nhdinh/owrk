secrets:
  postgres_passwd:
    file: ./.secrets/postgres_passwd.txt
  mongo_passwd:
    file: ./.secrets/mongo_passwd.txt
  jwt_secret_key:
    file: ./.secrets/jwt_secret_key.txt
    

services:
  # ======================
  # INFRASTRUCTURE SERVICES
  # ======================

  # PostgreSQL - Write Database
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: asset_postgres
    secrets:
      - postgres_passwd
    environment:
      POSTGRES_USR: ${POSTGRES_USR}
      POSTGRES_PASSWD_FILE: /run/secrets/postgres_passwd
      POSTGRES_MULTIPLE_DATABASES: auth_db,asset_db,procurement_db,maintenance_db,notification_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - Read Database (for CQRS)
  mongodb:
    image: mongo:7
    container_name: asset_mongodb
    secrets:
      - mongo_passwd
    environment:
      MONGO_PASSWD_FILE: /run/secrets/mongo_passwd
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - backend
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Caching & Session Store
  redis:
    image: redis:7-alpine
    container_name: asset_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # RabbitMQ - Message Queue (for CQRS & Event-Driven)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: asset_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP port
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================
  # API GATEWAY
  # ======================

  # nginx:
  #   image: nginx:alpine
  #   container_name: asset_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
