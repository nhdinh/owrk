# ======================
# NETWORKS
# ======================

networks:
  backend:
    driver: bridge

# ======================
# VOLUMES
# ======================

volumes:
  postgres-data:
    driver: local
  mongodb-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  asset-uploads:
    driver: local
