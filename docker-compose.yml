secrets:
  mysql_user_passwd:
    file: ./.secrets/mysql_user_passwd.txt
  mysql_root_passwd:
    file: ./.secrets/mysql_user_passwd.txt
  mongo_passwd:
    file: ./.secrets/mongo_passwd.txt
  jwt_secret_key:
    file: ./.secrets/jwt_secret_key.txt

services:

  # ======================
  # INFRASTRUCTURE SERVICES
  # ======================

  # MySQL - Write Database
  mysql:
    image: mysql:8.0
    container_name: mysql
    secrets:
      - mysql_root_passwd
      - mysql_user_passwd
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: yes
      MYSQL_ONETIME_PASSWORD: 1
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_passwd
      MYSQL_USER_PASSWORD_FILE: /run/secrets/mysql_user_passwd
      MYSQL_USER: ${MYSQL_USER:-officework_dbu}
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - "3306:3306"
    volumes:
      - ./.mysql_db:/var/lib/mysql
      - ./scripts/init-mysql.sh:/docker-entrypoint-initdb.d/init-mysql.sh
      - ./scripts/.init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123}" ]
      interval: 30s
      timeout: 5s
      retries: 5

  # MongoDB - Read Database (for CQRS)
  mongodb:
    image: mongo:7
    container_name: mongodb
    secrets:
      - mongo_passwd
    environment:
      MONGO_PASSWD_FILE: /run/secrets/mongo_passwd
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
    ports:
      - "27017:27017"
    volumes:
      - ./.mongo_db:/data/db
    networks:
      - backend
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 5s
      retries: 5

  # Redis - Caching & Session Store
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./.redis_data:/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # RabbitMQ - Message Queue (for CQRS & Event-Driven)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - ./.rabbit_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 5s
      retries: 5

  # ======================
  # API GATEWAY
  # ======================

  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./common-ui:/usr/share/nginx/common-ui:ro
    depends_on:
      auth-api:
        condition: service_healthy
      asset-api:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ======================
  # MICROSERVICES
  # ======================

  # Shared UI Service - Serves templates and static files
  shared-ui:
    build:
      context: ./services/shared-ui-service
      dockerfile: Dockerfile
    container_name: shared-ui
    environment:
      ENVIRONMENT: development
    volumes:
      - ./services/shared-ui-service/:/app/:ro
      - ./common-ui:/shared-ui:ro
    networks:
      - backend
    ports:
      - 5000:5000
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Auth Service
  auth-api:
    build:
      context: ./services/auth-api
      dockerfile: Dockerfile
    container_name: auth-api
    secrets:
      - jwt_secret_key
      - mysql_user_passwd
      - mongo_passwd
    environment:
      ENVIRONMENT: development
      DATABASE_USER: ${MYSQL_USER:-officework_dbu}
      DATABASE_PASSWORD_FILE: /run/secrets/mysql_user_passwd
      DATABASE_NAME: auth_db
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      MONGO_PASSWD_FILE: /run/secrets/mongo_passwd
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      MFA_ISSUER: AssetManagement
      AD_SERVER: ldap://ad.company.local
      AD_DOMAIN: company.local
      AD_BIND_DN: CN=admin,DC=company,DC=local
      AD_BIND_PASSWORD: ad_password
      AD_SEARCH_BASE: OU=Users,DC=company,DC=local
    volumes:
      - ./services/auth-api/:/app/:ro
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service (FastAPI + Jinja)
  auth-fe:
    build:
      context: ./services/auth-frontend
      dockerfile: Dockerfile
    container_name: auth-fe
    secrets:
      - jwt_secret_key
    environment:
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      API_BASE: http://auth-api:8000/api/v1
      AUTH_PREFIX: ${AUTH_PREFIX}
      ASSET_PREFIX: ${ASSET_PREFIX}
      SHARED_UI_URL: http://shared-ui:5000
      REDIS_URL: redis://redis:6379
      USE_REDIS_LOADER: true
    volumes:
      - ./services/auth-frontend/:/app/:ro
      - ./common-ui:/common-ui:ro
    depends_on:
      auth-api:
        condition: service_healthy
      shared-ui:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 30s

  # Asset Service
  asset-api:
    build:
      context: ./services/asset-api
      dockerfile: Dockerfile
    container_name: asset-api
    secrets:
      - jwt_secret_key
      - mysql_user_passwd
      - mongo_passwd
    environment:
      ENVIRONMENT: development
      DATABASE_USER: ${MYSQL_USER:-officework_dbu}
      DATABASE_PASSWORD_FILE: /run/secrets/mysql_user_passwd
      DATABASE_NAME: asset_db
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      MONGO_PASSWD_FILE: /run/secrets/mongo_passwd
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      JWT_ALGORITHM: HS256
      UPLOAD_DIR: /uploads
      MAX_UPLOAD_SIZE: 10485760
      DEPRECIATION_DAY_OF_MONTH: 1
      AUTH_SERVICE_URL: http://auth-api:8000
    volumes:
      - ./services/asset-api/:/app/:ro
      - asset-uploads:/uploads
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s

  # Asset Frontend (FastAPI + Jinja2)
  asset-fe:
    build:
      context: ./services/asset-frontend
      dockerfile: Dockerfile
    container_name: asset-fe
    secrets:
      - jwt_secret_key
    environment:
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      ASSET_API_URL: http://asset-api:8000/api/v1
      SHARED_UI_URL: http://shared-ui:5000
      REDIS_URL: redis://redis:6379
      USE_REDIS_LOADER: true
    volumes:
      - ./services/asset-frontend/:/app/:ro
      - ./common-ui:/common-ui:ro
    depends_on:
      asset-api:
        condition: service_healthy
      shared-ui:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/health" ]
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 30s
