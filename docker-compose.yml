secrets:
  mysql_user_passwd:
    file: ./.secrets/mysql_user_passwd.txt
  mysql_root_passwd:
    file: ./.secrets/mysql_root_passwd.txt
  mongo_passwd:
    file: ./.secrets/mongo_passwd.txt
  rabbit_passwd:
    file: ./.secrets/rabbit_passwd.txt
  jwt_secret_key:
    file: ./.secrets/jwt_secret_key.txt

services:
  # ======================
  # INFRASTRUCTURE SERVICES
  # ======================

  # MySQL - Write Database
  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    container_name: mysql
    secrets:
      - mysql_root_passwd
      - mysql_user_passwd
    environment:
      MYSQL_ONETIME_PASSWORD: 1
      MYSQL_USER: ${MYSQL_USER:-officework}
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - "3306:3306"
    volumes:
      - ./.mysql_db:/var/lib/mysql
    networks:
      - backend
    command: mysqld # --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$(cat /run/secrets/mysql_root_passwd)",
        ]
      interval: 1m
      timeout: 5s
      retries: 5

  # MongoDB - Read Database (for CQRS)
  mongodb:
    image: mongo:7
    container_name: mongodb
    secrets:
      - mongo_passwd
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      # MONGO_INITDB_ROOT_PASSWORD will be read from /run/secrets/mongo_passwd by entrypoint
    ports:
      - "27017:27017"
    volumes:
      - ./.mongo_db:/data/db
      - ./scripts/mongo-init.sh:/usr/local/bin/mongo-init.sh:ro
    networks:
      - backend
    entrypoint: ["/bin/bash", "/usr/local/bin/mongo-init.sh", "mongod"]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 1m
      timeout: 5s
      retries: 5

  # Redis - Caching & Session Store
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./.redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # InfluxDB - Time-Series Database (for service metrics & monitoring)
  influxdb:
    image: influxdb:2.7-alpine
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword123
      DOCKER_INFLUXDB_INIT_ORG: officework
      DOCKER_INFLUXDB_INIT_BUCKET: service_metrics
      DOCKER_INFLUXDB_INIT_RETENTION: 90d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-auth-token
    volumes:
      - ./.influxdb_data:/var/lib/influxdb2
      - ./.influxdb_config:/etc/influxdb2
    networks:
      - backend
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 1m
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # RabbitMQ - Message Queue (for CQRS & Event-Driven)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - ./.rabbit_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 1m
      timeout: 5s
      retries: 5

  # ======================
  # API GATEWAY
  # ======================

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./scripts/register_service.sh:/rs_template:ro
      - ./scripts/nginx_entrypoint_wrapper.sh:/nginx-entrypoint-wrapper.sh:ro
    depends_on:
      auth-api:
        condition: service_healthy
      asset-api:
        condition: service_healthy
      dashboard-api:
        condition: service_healthy
      procurement-api:
        condition: service_healthy
      auth-fe:
        condition: service_started
      asset-fe:
        condition: service_started
      dashboard-fe:
        condition: service_started
      procurement-fe:
        condition: service_started
    environment:
      HOST_NAME: api-gateway
      HOST_PORT: 8000
      HEALTH_ENDPOINT: /health
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 10s

  # ======================
  # MICROSERVICES
  # ======================

  service-registry:
    build:
      context: ./services/service-registry
      dockerfile: Dockerfile
    container_name: service-registry
    secrets:
      - mongo_passwd
    ports:
      - 3000:3000
    environment:
      SERVICES_CACHE_FILE: /services.json
      MONGO_PASSWD_FILE: /run/secrets/mongo_passwd
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: my-super-secret-auth-token
      INFLUXDB_ORG: officework
      INFLUXDB_BUCKET: service_metrics
    depends_on:
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    volumes:
      - ./.config/services.json:/services.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Auth Service
  auth-api:
    build:
      context: ./services/auth-api
      dockerfile: Dockerfile
    container_name: auth-api
    secrets:
      - jwt_secret_key
      - mysql_user_passwd
      - mongo_passwd
    ports:
      - 8001:8000
    environment:
      ENVIRONMENT: development
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD_FILE: /run/secrets/mysql_user_passwd
      DATABASE_NAME: auth_db
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      MONGO_PASSWD_FILE: /run/secrets/mongo_passwd
      MONGODB_PASSWORD_FILE: /run/secrets/mongo_passwd
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      MFA_ISSUER: AssetManagement
      AD_SERVER: ldap://ad.company.local
      AD_DOMAIN: company.local
      AD_BIND_DN: CN=admin,DC=company,DC=local
      AD_BIND_PASSWORD: ad_password
      AD_SEARCH_BASE: OU=Users,DC=company,DC=local
    volumes:
      - ./services/auth-api/:/app/
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s

  # Asset Service
  asset-api:
    build:
      context: ./services/asset-api
      dockerfile: Dockerfile
    container_name: asset-api
    secrets:
      - jwt_secret_key
      - mysql_user_passwd
      - mongo_passwd
    ports:
      - 8002:8000
    environment:
      ENVIRONMENT: development
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD_FILE: /run/secrets/mysql_user_passwd
      DATABASE_NAME: asset_db
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      MONGO_PASSWD_FILE: /run/secrets/mongo_passwd
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      JWT_ALGORITHM: HS256
      UPLOAD_DIR: /uploads
      MAX_UPLOAD_SIZE: 10485760
      DEPRECIATION_DAY_OF_MONTH: 1
      AUTH_SERVICE_URL: http://auth-api:8000
    volumes:
      - ./services/asset-api/:/app/
      - asset-uploads:/uploads
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s

  # Procurement Service
  procurement-api:
    build:
      context: ./services/procurement-api
      dockerfile: Dockerfile
    container_name: procurement-api
    secrets:
      - jwt_secret_key
      - mysql_user_passwd
      - mongo_passwd
    ports:
      - 8004:8004
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: procurement_db
      DATABASE_USER: ${MYSQL_USER}
      DB_PASSWORD_FILE: /run/secrets/mysql_user_passwd
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: procurement_read_db
      MONGODB_USER: admin
      MONGODB_PASSWORD_FILE: /run/secrets/mongo_passwd
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      ALGORITHM: HS256
      HOST_PORT: 8004
      HOST_NAME: procurement-api
      HEALTHCHECK: /health
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8000"
    volumes:
      - ./services/procurement-api/:/app/
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s

  # Admin API
  admin-api:
    build:
      context: ./services/admin-api
      dockerfile: Dockerfile
    container_name: admin-api
    secrets:
      - jwt_secret_key
      - mysql_user_passwd
    ports:
      - 8005:8000
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: admin_db
      DATABASE_USER: ${MYSQL_USER}
      DB_PASSWORD_FILE: /run/secrets/mysql_user_passwd
      SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      ALGORITHM: HS256
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HOST_PORT: 8005
      HOST_NAME: admin-api
      HEALTHCHECK: /health
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8000"
      SERVICE_REGISTRY_URL: http://service-registry:3000
      AUTH_SERVICE_URL: http://auth-api:8000
    volumes:
      - ./services/admin-api/:/app/
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s

  # Auth Frontend V2 (React + Vite)
  auth-fe:
    build:
      context: ./services/auth-frontend
      dockerfile: Dockerfile
    container_name: auth-fe
    # No environment variables needed - uses relative path /api/v1 which nginx proxies to auth-api
    ports:
      - "3100:80"
    volumes:
      - ./scripts/register_service.sh:/rs_template:ro
      - ./scripts/nginx_entrypoint_wrapper.sh:/nginx-entrypoint-wrapper.sh:ro
    environment:
      HOST_NAME: auth-fe
      HOST_PORT: 80
      HEALTH_ENDPOINT: /
    depends_on:
      auth-api:
        condition: service_healthy
      shared-components:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 10s

  asset-fe:
    build:
      context: ./services/asset-frontend
      dockerfile: Dockerfile
    container_name: asset-fe
    # No environment variables needed - uses relative path /api/v1 which nginx proxies to asset-api
    ports:
      - "3200:80"
    volumes:
      - ./scripts/register_service.sh:/rs_template:ro
      - ./scripts/nginx_entrypoint_wrapper.sh:/nginx-entrypoint-wrapper.sh:ro
    environment:
      HOST_NAME: asset-fe
      HOST_PORT: 80
      HEALTH_ENDPOINT: /
    depends_on:
      asset-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
      shared-components:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 10s

  # ======================
  # DASHBOARD SERVICES
  # ======================

  # Dashboard API
  dashboard-api:
    build:
      context: ./services/dashboard-api
      dockerfile: Dockerfile
    container_name: dashboard-api
    secrets:
      - mysql_user_passwd
      - mongo_passwd
      - jwt_secret_key
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-officework}
      MYSQL_DATABASE: auth_db
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_user_passwd
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USER: admin
      MONGODB_DATABASE: officework_read
      MONGODB_PASSWORD_FILE: /run/secrets/mongo_passwd
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ASSET_API_URL: http://asset-api:8000/api/v1
      AUTH_API_URL: http://auth-api:8000/api/v1
      DEBUG: ${DEBUG:-True}
    ports:
      - "8003:8000"
    volumes:
      - ./services/dashboard-api/app:/app/app:ro
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-api:
        condition: service_healthy
      asset-api:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 30s

  # Dashboard Frontend V2
  dashboard-fe:
    build:
      context: ./services/dashboard-frontend
      dockerfile: Dockerfile
    container_name: dashboard-fe
    # No environment variables needed - uses relative path /api/v1 which nginx proxies to dashboard-api
    ports:
      - "3300:80"
    volumes:
      - ./scripts/register_service.sh:/rs_template:ro
      - ./scripts/nginx_entrypoint_wrapper.sh:/nginx-entrypoint-wrapper.sh:ro
    environment:
      HOST_NAME: dashboard-fe
      HOST_PORT: 80
      HEALTH_ENDPOINT: /dashboard
    depends_on:
      dashboard-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
      shared-components:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 1m
      timeout: 5s
      retries: 3

  # Admin Frontend
  admin-fe:
    build:
      context: ./services/admin-frontend
      dockerfile: Dockerfile
    container_name: admin-fe
    ports:
      - "3502:80"
    volumes:
      - ./scripts/register_service.sh:/rs_template:ro
      - ./scripts/nginx_entrypoint_wrapper.sh:/nginx-entrypoint-wrapper.sh:ro
    environment:
      HOST_NAME: admin-fe
      HOST_PORT: 80
      HEALTH_ENDPOINT: /
    depends_on:
      - admin-api
    networks:
      - backend
    restart: unless-stopped

  # Shared Components - Module Federation Host
  shared-components:
    build:
      context: ./services/shared-components
      dockerfile: Dockerfile
    container_name: shared-components
    ports:
      - "3400:80"
    volumes:
      - ./services/shared-components/src/config/navigation.yaml:/usr/share/nginx/html/navigation.yaml:ro
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 10s

  # Procurement Frontend V2
  procurement-fe:
    build:
      context: ./services/procurement-frontend
      dockerfile: Dockerfile
    container_name: procurement-fe
    # No environment variables needed - uses relative path /api/v1 which nginx proxies to procurement-api
    ports:
      - "3501:80"
    volumes:
      - ./scripts/register_service.sh:/rs_template:ro
      - ./scripts/nginx_entrypoint_wrapper.sh:/nginx-entrypoint-wrapper.sh:ro
    environment:
      HOST_NAME: procurement-fe
      HOST_PORT: 80
      HEALTH_ENDPOINT: /
    depends_on:
      procurement-api:
        condition: service_healthy
      shared-components:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 10s

