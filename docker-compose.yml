  # ======================
  # MICROSERVICES
  # ======================

  # Auth Service
  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: auth-service
    secrets:
      - jwt_secret_key
      - postgres_passwd
      - mongo_passwd
    environment:
      ENVIRONMENT: development
      DATABASE_USER: ${POSTGRES_USR}
      POSTGRES_PASSWD_FILE: /run/secrets/postgres_passwd
      DATABASE_NAME: ${POSTGRES_DB_NAME}
      MONGO_PASSWD_FILE: /run/secrets/mongo_passwd
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      MFA_ISSUER: AssetManagement
      AD_SERVER: ldap://ad.company.local
      AD_DOMAIN: company.local
      AD_BIND_DN: CN=admin,DC=company,DC=local
      AD_BIND_PASSWORD: ad_password
      AD_SEARCH_BASE: OU=Users,DC=company,DC=local
    volumes:
      - ./services/auth/app:/app/app:ro
    ports:
      - "8088:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service (FastAPI + Jinja)
  frontend-service:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: frontend-service
    secrets:
      - jwt_secret_key
    environment:
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      API_BASE: http://auth-service:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

