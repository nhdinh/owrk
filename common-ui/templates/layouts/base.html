<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block meta_description %}Asset Management System - Quản lý tài sản văn phòng{% endblock %}">
    <title>{% block title %}Asset Management{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Common UI CSS -->
    <link rel="stylesheet" href="/common-ui/static/css/common.css?etag={{ common_css_etag }}">
    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
    {% block navbar %}
    {% include 'components/navbar.html' %}
    {% endblock %}

    <main class="flex-grow-1">
        <!-- Flash Messages -->
        {% include 'components/messages.html' %}

        {% block content %}{% endblock %}
    </main>

    {% block footer %}
    {% include 'components/footer.html' %}
    {% endblock %}

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Common UI JS -->
    <script src="/common-ui/static/js/common.js?etag={{ common_js_etag }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
