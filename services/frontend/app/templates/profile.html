{% extends 'base.html' %}
{% block title %}Hồ sơ{% endblock %}
{% block content %}
<div class="container">
  <h1>Hồ sơ người dùng</h1>
  <ul>
    <li>Email: {{ user.email }}</li>
    <li>Tên: {{ user.full_name }}</li>
    <li>Loại tài khoản: {{ user.user_type }}</li>
    <li>MFA: {{ 'Bật' if user.mfa_enabled else 'Tắt' }}</li>
  </ul>
  <a href="/dashboard">Quay lại Dashboard</a>
{% endblock %}
