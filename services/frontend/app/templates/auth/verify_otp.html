{% extends 'base.html' %}
{% block title %}Xác thực OTP{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Xác thực OTP</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/verify-otp">
    <label>Mã OTP</label>
    <input type="text" name="otp_code" inputmode="numeric" pattern="[0-9]{6}" required />
    <button type="submit">Xác thực</button>
  </form>
{% endblock %}
