# Navigation Configuration for Asset Management System
# This file defines the sidebar menu structure for all services

navigation:
  - name: Dashboard
    href: /dashboard/
    icon: Home
    service: dashboard
    description: System overview and statistics

  - name: Users & Roles
    href: /auth/
    icon: Shield
    service: auth
    description: User and role management
    submenu:
      - name: Users
        href: /auth/users
        icon: Users
        description: Manage users
      - name: Roles
        href: /auth/roles
        icon: ShieldCheck
        description: Manage roles and permissions
      - name: Profile
        href: /auth/profile
        icon: User
        description: My profile settings
      - name: MFA Setup
        href: /auth/mfa-setup
        icon: Key
        description: Multi-factor authentication

  - name: Assets
    href: /assets/
    icon: Package
    service: assets
    description: Asset management
    submenu:
      - name: All Assets
        href: /assets/
        icon: Package
        description: View all assets
      - name: Categories
        href: /assets/categories
        icon: FolderTree
        description: Manage asset categories
      - name: Assignments
        href: /assets/assignments
        icon: UserCheck
        description: Asset assignments
      - name: Maintenance
        href: /assets/maintenance
        icon: Wrench
        description: Maintenance schedule

  - name: Procurement
    href: /procurement/
    icon: ShoppingCart
    service: procurement
    description: Procurement and purchasing management
    submenu:
      - name: Dashboard
        href: /procurement/dashboard
        icon: LayoutDashboard
        description: Procurement overview
      - name: Purchase Requests
        href: /procurement/purchase-requests
        icon: FileText
        description: Manage purchase requests
      - name: Vendors
        href: /procurement/vendors
        icon: Building2
        description: Vendor management
      - name: Quotations
        href: /procurement/quotations
        icon: FileSpreadsheet
        description: Price quotations
      - name: Purchase Orders
        href: /procurement/purchase-orders
        icon: ShoppingBag
        description: Purchase orders
      - name: Framework Contracts
        href: /procurement/framework-contracts
        icon: FileSignature
        description: Long-term contracts

  - name: Administration
    href: /admin/
    icon: Settings
    service: admin
    description: System administration and settings
    submenu:
      - name: Dashboard
        href: /admin/dashboard
        icon: LayoutDashboard
        description: Admin overview
      - name: Trash
        href: /admin/trash
        icon: Trash2
        description: Recycle bin for all modules
      - name: Module Settings
        href: /admin/settings
        icon: Sliders
        description: Module configuration
      - name: System Modules
        href: /admin/modules
        icon: Blocks
        description: Installed modules
      - name: Audit Logs
        href: /admin/audit-logs
        icon: FileText
        description: System audit trail
