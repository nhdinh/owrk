server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Serve remoteEntry.js with correct MIME type (with /shared/ prefix)
    location ~ ^/shared/assets/remoteEntry\.js$ {
        rewrite ^/shared/(.*)$ /$1 break;
        add_header Content-Type application/javascript;
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # Serve static assets (with /shared/ prefix)
    location /shared/assets/ {
        rewrite ^/shared/(.*)$ /$1 break;
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # Handle /shared/ base path
    location /shared/ {
        rewrite ^/shared/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Handle root path (fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
